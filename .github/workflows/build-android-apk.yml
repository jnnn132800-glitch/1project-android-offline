name: Build 1Project Native Android APK (Debug & Unit Tests)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Run JUnit Tests (Phase 01-11) & Build Native Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Android SDK (API 35)
        uses: android-actions/setup-android@v3

      - name: 4. Set up Official Gradle 8.9 (No Fake Wrapper Needed)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 5. Ensure Room Schema Directory Exists
        run: mkdir -p app/schemas

      - name: 6. Run Unit Tests (Phase 01-11 Deterministic Domain, Room DAO & Security Tests)
        run: gradle testDebugUnitTest --stacktrace

      - name: 7. Assemble Native Android Debug APK (Kotlin + Jetpack Compose + Room)
        run: gradle assembleDebug --stacktrace

      - name: 8. Upload Compiled Native Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1Project-Android-Offline-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 9. Upload JUnit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1Project-JUnit-Test-Reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 30
